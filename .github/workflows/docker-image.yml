name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to build, scan and push'
        required: false
        default: 'latest'

env:
  DOCKER_IMAGE: muralisocial123/aws-retail-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (local only, not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      # ---- DevSecOps: Trivy scan stage ----------------------------------

      - name: Run Trivy vulnerability scan (full report)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          output: trivy-report.txt
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
          exit-code: '0'

      - name: Print Trivy report to console
        run: cat trivy-report.txt

      - name: Publish Trivy report to job summary
        run: |
          {
            echo "## Trivy Vulnerability Scan Report"
            echo "Image: \`${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}\`"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ env.IMAGE_TAG }}
          path: trivy-report.txt

      - name: Check email secrets configured
        id: email_check
        run: |
          if [ -n "${{ secrets.EMAIL_USERNAME }}" ] && [ -n "${{ secrets.EMAIL_PASSWORD }}" ] && [ -n "${{ secrets.EMAIL_TO }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email Trivy report
        if: steps.email_check.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'Trivy Scan Report - ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} (${{ job.status }})'
          to: ${{ secrets.EMAIL_TO }}
          from: 'DevSecOps Pipeline <${{ secrets.EMAIL_USERNAME }}>'
          body: |
            Trivy vulnerability scan completed for ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}.
            Triggered by: ${{ github.event_name }} (${{ github.actor }})
            Full report is attached.
          attachments: trivy-report.txt

      - name: Trivy vulnerability gate (block push on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # ---- Push (only reached if the gate above passed) ------------------

      - name: Push Docker image to Docker Hub
        run: docker push ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Run docker-compose
        run: |
          docker-compose down || true
          docker-compose pull
          docker-compose up -d
